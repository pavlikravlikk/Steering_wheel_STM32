spring_amps_360           = { value = 2.4, status = "assumed", how_to_measure = "Amps at 360 deg from the centre (0..max_amps; must not decrease with the angle)." }
spring_amps_450           = { value = 3.4, status = "assumed", how_to_measure = "Amps at 450 deg from the centre (0..max_amps; must not decrease with the angle)." }
spring_amps_540           = { value = 5.0, status = "assumed", how_to_measure = "Amps at 540 deg from the centre (0..max_amps; must not decrease with the angle)." }
damper_amps_per_turn_s  = { value = 0.3, status = "assumed", note = "2026-11-18 (owner: turning from 0 to 1 turn must be light, less jerking, gravel stronger). Was 0.5. 2026-11-18 (owner: too heavy even at 0-1 turn, return to a standard 5 A set-up) -> standard values. Was 1.6 (too thick). 2026-11-18 (owner report: the wheel hunts on a straight road, gravel and viscous effects are fine, i.e. extra damping calms it): 1.0 -> 1.6. Before: 2026-11-18 (owner decision): 0.25 -> 1.0 because the centre of the spring curve is stiffer (about 4 A/turn) and needs more damping not to ring. Before: 2026-11-17 (owner decision): 0.05 -> 0.25 A per (turn/s), a fast turn feels heavier (0.25 A at 1 turn/s). The built-in damper and friction always act while armed; the spring too in this build (FFB_SPRING_ONLY_WITHOUT_HOST=0)", how_to_measure = "A per (wheel turn/s)." }
friction_amps           = { value = 0.04, status = "assumed", note = "2026-11-18 (owner: turning from 0 to 1 turn must be light, less jerking, gravel stronger). Was 0.05. 2026-11-18 (owner: too heavy even at 0-1 turn, return to a standard 5 A set-up) -> standard values. Was 0.12 (too sticky). 2026-11-18: 0.03 -> 0.12 A: a little constant friction stops the small back-and-forth hunting around the centre (the same calming the owner feels on gravel and in viscous effects)", how_to_measure = "Constant friction-like force (A) opposing motion." }
inertia_amps_per_turn_s2 = { value = 0.0, status = "assumed", how_to_measure = "Inertia compensation placeholder (0 = off)." }
