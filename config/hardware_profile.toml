# =============================================================================
# hardware_profile.toml  -  THE single source of truth for the physical setup.
# =============================================================================
#
# Edit ONLY this file when the hardware changes, then run
#     python3 tools/gen_config.py            (or just rebuild the firmware:
#                                             CMake re-runs the generator)
# which regenerates
#     steeringwheel_firmware/Core/Inc/wheel_config_generated.h
#     tools/generated/odrive_setup.py
#     tools/generated/odrive_calibrate.py
#
# Every entry has:
#   value           the number/bool/string used by the generators
#   status          "TBD"      = placeholder, not yet checked on the real hardware
#                   "measured" = measured / read from the real hardware
#                   "assumed"  = deliberately chosen (a design decision), not measured
#   how_to_measure  what to do to fill it in (see docs/HARDWARE_BRINGUP.md)
#
# All values below are the PLACEHOLDERS the firmware used before the belt was
# installed. They reproduce the previous firmware behaviour exactly.
# `python3 tools/gen_config.py --require-measured` refuses any TBD.
# =============================================================================

[meta]
profile_version = 1
description = "Sim-racing wheel: STM32F3Discovery + MKS ODrive Mini (0.5.x) + hoverboard hub motor"

# -----------------------------------------------------------------------------
[belt]
# Section name kept for compatibility with the generators/tests. Since 2026-11-16 this is a GEAR PAIR, not a belt:
# an external pinion on the encoder shaft meshes with an internal gear on the motor housing (the housing is
# the rotating outer rotor). Ratio teeth_housing:teeth_pulley = 20:20 = 1:1 -> one housing turn = one encoder
# turn, cpr = 4*600*20/20 = 2400. The EXACT counts per turn must still be verified on the bench (H5).
teeth_housing = { value = 20, status = "measured", note = "counted by the user, 2026-11-16", how_to_measure = "Teeth of the internal gear on the motor housing. Done (20). Bench check still required: rotate the housing 10 full turns, expect about 24000 counts (tools/measure_counts.py wheel --turns 10 ...)." }
teeth_pulley  = { value = 20, status = "measured", note = "counted by the user, 2026-11-16", how_to_measure = "Teeth of the external pinion on the encoder shaft. Done (20). Bench check as for teeth_housing." }

# -----------------------------------------------------------------------------
[encoder]
ppr          = { value = 600, status = "measured", note = "bench 2026-11-17: 10 housing turns = 23987 counts (2398.7 per turn, 0.05 percent from 2400); this confirms ppr x quadrature x gear ratio as a product", how_to_measure = "LPD3806-600BM: 600 pulses per revolution per channel (label). Confirm with tools/measure_counts.py: one encoder-shaft turn by hand must give 4*PPR counts." }
quadrature   = { value = 4, status = "measured", note = "bench 2026-11-17: see encoder.ppr (product confirmed: 2398.7 counts per housing turn)", how_to_measure = "ODrive counts every edge of A and B (x4). Keep 4 unless the measurement says otherwise." }
has_index    = { value = false, status = "measured", note = "ODrive reports encoder.config.use_index False and the offset calibration works at 5 A (2026-11-17)", how_to_measure = "LPD3806 has no Z/index channel. Keep false." }

# -----------------------------------------------------------------------------
[motor]
pole_pairs       = { value = 15, status = "measured", note = "ODrive encoder offset calibration accepts cpr 2400 with 15 pole pairs at 5 A (CPR_POLEPAIRS check passes, repeated twice, 2026-11-17); magnets not counted by hand", how_to_measure = "Hoverboard hub motor: 30 magnets = 15 pole pairs (ODrive hoverboard guide). Count magnets or check the motor data." }
phase_resistance = { value = 0.166, status = "measured", how_to_measure = "Read axis0.motor.config.phase_resistance after a MOTOR_CALIBRATION (ohm). Documentation only." }
# Direct drive: the steering wheel is bolted to the motor housing. 1 housing turn = 1 wheel turn = 1 encoder turn
# (20:20 gear pair). Still TBD: confirm on the bench (H5/H8), the user only reported the gear teeth.
motor_turns_per_wheel_rev = { value = 1.0, status = "measured", note = "bench 2026-11-17: 10 clockwise housing turns by hand gave shadow_count -21395 -> -45382 (-23987), implied ratio 1:1, odrive_turns_per_wheel_rev 0.9995", how_to_measure = "Turn the steering wheel exactly one full turn and watch the motor housing: number of housing turns. 1.0 for direct drive." }

# -----------------------------------------------------------------------------
[odrive]
# GENTLE profile applied by tools/generated/odrive_setup.py (dry run by default).
# The firmware never writes any of these; the FFB build only READS them and
# refuses to arm if the live value is above the value here.
axis                         = { value = 0, status = "measured", how_to_measure = "docs/odrive_dump.txt: the motor calibration (phase_resistance 0.166 ohm, is_calibrated True) is on axis0." }
current_lim                  = { value = 6.0, status = "assumed", note = "2026-11-18: 4 -> 6 A because ffb.max_amps is 6 A (gen_config: max_amps <= current_lim); the encoder calibration at 6 A needs 7 A (encoder_cal_current_lim). Before: applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench", how_to_measure = "Amps. Start low (4 A). The precheck refuses to arm if axis0.motor.config.current_lim is higher." }
calibration_current          = { value = 3.0, status = "assumed", note = "NOT USABLE FOR CALIBRATION. Bench 2026-11-17: 3 A and 4 A fail with CPR_POLEPAIRS_MISMATCH, 5 A (with current_lim 6 A) passes twice. Calibrate by hand in odrivetool with motor.config.current_lim = 6 and calibration_current = 5, then apply this profile (odrive_setup.py --apply). This value is only the resting value written after calibration", how_to_measure = "Amps used by motor/encoder calibration. Must be <= current_lim. Increase only if calibration fails." }
encoder_cal_current          = { value = 6.0, status = "measured", note = "2026-11-18: 5 A failed twice (CPR_POLEPAIRS_MISMATCH, the rotor stopped at ~170 deg), 6 A with current_lim 7 A passed once by hand. Before: bench 2026-11-17: the encoder offset calibration of this 4 kg rotor passes at 5 A (with current_lim 6 A), fails with CPR_POLEPAIRS_MISMATCH at 3 A and at 4 A. Used only by tools/session_start.py, which sets it for the calibration and then applies the profile again", how_to_measure = "Amps used by ENCODER_OFFSET_CALIBRATION (motor.config.calibration_current) during tools/session_start.py." }
encoder_cal_current_lim      = { value = 7.0, status = "measured", note = "2026-11-18: 6 -> 7 A (see encoder_cal_current). Before: bench 2026-11-17: motor.config.current_lim must be at least this during the calibration at encoder_cal_current; the profile current_lim (4 A, checked by the FFB precheck) is applied again right after", how_to_measure = "Amps: temporary motor.config.current_lim during the encoder offset calibration only (tools/session_start.py)." }
vel_limit                    = { value = 4.0, status = "measured", note = "2026-11-17 (owner decision): 2 -> 4 turns/s. The ODrive trips OVERSPEED at vel_limit * 1.2 (2.4 -> 4.8 turns/s) and caps the torque to (vel_limit - speed) * vel_gain; a game crash gave FFB fault ODRIVE_ERROR (the cause was not read, OVERSPEED at 2.4 turns/s is the likely one: a hand moves faster than that) and the taper weakened every fast force. Back-EMF reaches the 24 V supply at about 6 turns/s (estimate, KV not measured): stay below it. Applied to the ODrive (RAM) by tools/session_start.py and read back", how_to_measure = "Motor turns/s. 2 turns/s = 720 deg/s at the wheel (direct drive). The precheck refuses to arm if higher." }
vel_gain                     = { value = 0.8, status = "assumed", note = "2026-11-18: 0.25 -> 0.4 because max_amps 3.0 needs vel_limit * vel_gain >= 1.5 (not measured at this value). Before: bench 2026-11-17: with enable_current_mode_vel_limit the ODrive clips the torque to (vel_limit - speed) * vel_gain. The saved vel_gain 0.02 gave 2 * 0.02 = 0.04 Nm at rest: Iq_setpoint read 0.0822 A = 0.041125 Nm (speed -0.05625 turn/s: (2 + 0.05625) * 0.02 = 0.041125), so the spring was not felt although 0.2373 Nm reached input_torque. With 0.25 (set in RAM by hand) the spring pulled at 0.5 A and the housing returned to the centre by itself (F5 sign check passed)", how_to_measure = "Nm per (turn/s). Torque limit at rest = vel_limit * vel_gain, falling linearly to 0 at vel_limit (a soft speed limiter). Must satisfy vel_limit * vel_gain >= ffb.max_amps * torque_constant (gen_config checks it). Read axis0.controller.config.vel_gain; not used in torque control mode except by this limiter." }
enable_current_mode_vel_limit = { value = true, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench", how_to_measure = "Name in THIS build (docs/odrive_dump.txt; 0.5.6 calls it enable_torque_mode_vel_limit). Saved: True. Keep true: in torque mode the ODrive reduces torque above vel_limit." }
enable_overspeed_error        = { value = true, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench", how_to_measure = "Saved: True (with vel_limit_tolerance 1.2). Keep true: the ODrive itself errors above 1.2 x vel_limit." }
dc_bus_overvoltage_trip_level  = { value = 30.0, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench", how_to_measure = "Volts. Supply is 24 V; regenerated energy pumps the bus up. 30 V trips well below the 56 V factory value." }
dc_bus_undervoltage_trip_level = { value = 18.0, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench", how_to_measure = "Volts. Below this the ODrive disarms." }
dc_max_positive_current      = { value = 6.0, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench", how_to_measure = "Amps drawn from the supply (motoring)." }
dc_max_negative_current      = { value = -1.5, status = "measured", note = "owner approved 2026-11-16 (assistant proposal): -1.5 A, about 36 W peak into the 50 W resistor at 24 V; the saved value is -3.0 A; BENCH 2026-11-17: value applied and read back 2026-11-17; behaviour under real regeneration not yet tested (F5/F6)", how_to_measure = "Negative DC-bus current allowed before DC_BUS_OVER_REGEN_CURRENT. The brake resistor on AUX is 50 W / 2 ohm (label, user 2026-11-16) and max_regen_current is 0.0, so regen goes into the resistor: at -3 A and 24-30 V the peak is about 70-90 W, above its 50 W continuous rating, therefore -1.5 A (about 36 W) is proposed. Confirm on the bench (heat sink fitted) before marking measured." }
brake_resistance             = { value = 2.0, status = "measured", note = "resistor 50 W / 2 ohm on the AUX terminal, read from its label by the user, 2026-11-16", how_to_measure = "Saved: 2.0 ohm. CHECK ONLY (never written by odrive_setup.py). Label: 50 W, 2 ohm (user, 2026-11-16). Still unchecked: that it sits on a heat sink and that the wiring to AUX is correct; at the profile limit dc_max_negative_current = -3 A the peak power at 24-30 V is about 70-90 W, above 50 W continuous (fine only for short bursts)." }
max_regen_current            = { value = 0.0, status = "assumed", note = "property does not exist on this firmware build (odrive_status.py --live: NOT PRESENT, 2026-11-17), so it can be neither read nor written; regeneration is limited by dc_max_negative_current and the over-voltage trip instead", how_to_measure = "Saved: 0.0 A (current that may flow back into the PSU; 0 = all regen to the brake resistor). CHECK ONLY (never written)." }
watchdog_timeout             = { value = 0.25, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench; F4: the axis left closed loop after the STM32 stopped feeding", how_to_measure = "Seconds. The FFB build feeds 'u 0' every 5 ms while running. The precheck requires enable_watchdog = True and a timeout inside [ffb.watchdog_timeout_min_s, ffb.watchdog_timeout_max_s]." }
enable_watchdog              = { value = true, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench; this build checks the watchdog while IDLE too (F3), the STM32 must feed it (FFB_FEED_WATCHDOG_WHEN_DISARMED=1)", how_to_measure = "Required by the FFB precheck. Check on the bench whether your 0.5.x build also checks the watchdog while IDLE (docs/HARDWARE_BRINGUP.md step F3)." }
torque_constant              = { value = 0.5, status = "measured", note = "2026-11-16: the live ODrive reads 0.5 (the old dump had 0.04); 8.27/KV with KV about 16 gives about 0.52 Nm/A", how_to_measure = "Nm/A. The firmware READS it and converts amps -> torque units, and the ODrive turns torque back into current with the same constant, so the commanded CURRENT does not depend on its accuracy; only the torque units do. 0.5 is the live value and matches 8.27/KV. Confirm with the motor data if the real torque matters." }
encoder_mode                 = { value = 0, status = "measured", note = "applied to the ODrive (RAM) and read back by tools/odrive_status.py --live, 2026-11-17 bench", how_to_measure = "ENCODER_MODE_INCREMENTAL = 0." }

# -----------------------------------------------------------------------------
[wheel]
lock_to_lock_deg = { value = 900, status = "assumed", note = "owner decision 2026-11-16: 900 deg total (+-450), the common default of most games; the owner first said 540 per side = 1080", how_to_measure = "Total steering angle from full left to full right, in degrees (design choice, 900 = +-450). Bench check (H8): X must reach 0 / 65535 at exactly 450 deg each side." }
invert           = { value = true, status = "measured", note = "bench 2026-11-16: wheel turned clockwise (driver view) made X DEcrease (32768 -> 19616 at ~180 deg, 6556 at ~360 deg), so invert = true", how_to_measure = "Turn the wheel clockwise (seen from the driver). HID X must increase. If it decreases set true. Done: it decreased, so true. Re-check after the next flash: clockwise must now INCREASE X." }
centre_mode      = { value = "power_up", status = "assumed", how_to_measure = "power_up = the position at boot is the centre; B1 held 1 s re-centres. (Only option for now; no index pulse.)" }

# -----------------------------------------------------------------------------
[uart]
baud = { value = 115200, status = "measured", how_to_measure = "docs/odrive_dump.txt: config.enable_uart = True, config.uart_baudrate = 115200. 115200 limits the FFB command rate to about 200 Hz; 921600 would allow 1 kHz (future)." }

# -----------------------------------------------------------------------------
[mcp23017]
address_7bit = { value = 0x20, status = "TBD", how_to_measure = "A0..A2 tied to GND -> 0x20. Check with the wiring." }
use_ipol     = { value = false, status = "assumed", how_to_measure = "false = invert in software (switch to GND = pressed). true = the chip inverts (IPOLA/IPOLB)." }
active_low   = { value = true, status = "TBD", how_to_measure = "Buttons switch the input to GND with internal pull-ups. Documentation only (the firmware assumes active-low)." }

# -----------------------------------------------------------------------------
[ffb]
# Force feedback limits (used only when the firmware is built with -DWHEEL_FFB=ON).
max_amps                = { value = 5.0, status = "assumed", note = "2026-11-18 (owner decision): 4.0 -> 5.0 A for a stronger wall, together with regen_power_limit_w (the braking power limit that keeps the supply from rising). Before: 2026-11-18 (owner decision): 6.0 -> 4.0 A (about 2 Nm) after the supply rose 24 -> 28 V (regeneration) when the wheel was forced against the 6 A wall; the code ceiling FFB_HARD_CAP_AMPS stays 6 A. Before: 2026-11-18 (owner decision, second step the same day): 3.0 -> 6.0 A (about 3 Nm), code ceiling 6.0 A; needs odrive.current_lim 6.0 and vel_gain 0.8; wheel still DISMOUNTED, safety-case items still NOT done. Before: 1.0 -> 3.0 A (about 1.5 Nm), code ceiling FFB_HARD_CAP_AMPS raised to 3.0 A with it; wheel still DISMOUNTED, the safety-case items below are still NOT done (do not mount the wheel at this value); needs vel_limit * vel_gain >= 3.0 * 0.5 (vel_gain 0.25 -> 0.4). Before: F5 step 4 (owner decision 2026-11-17): 1.0 A = the code ceiling (FFB_HARD_CAP_AMPS), about 0.50 Nm; game felt but weak at 0.8 A. vel_limit * vel_gain = 0.5 >= 1.0 * 0.5 holds exactly. More than 1 A needs a reviewed safety case (mechanical stop, OVERSPEED test on hardware, thermal check, tested e-stop, 3-button arm). Before: F5 step 3: 0.8 A (about 0.40 Nm), wheel dismounted, because at 100 percent of 0.5 A (ff_play.py constant, sine, pulse) the effects were barely perceptible. Steps: 0.3 A -> 0.5 A -> 0.8 A -> (1.0 A = code ceiling). Needs odrive.vel_limit * odrive.vel_gain >= max_amps * torque_constant (0.5 >= 0.4). Step 1 (0.3 A, spring 0.2 A/turn) armed and ran correctly but the force (about 0.1 Nm) was too small to feel, so the physical sign of the spring could not be judged. Raise only in small steps", how_to_measure = "Hard cap of the total commanded current (A). The firmware also has a compile-time ceiling of 1.0 A (FFB_HARD_CAP_AMPS in Core/Inc/ffb/ffb_config.h)." }
slew_amps_per_s         = { value = 80.0, status = "assumed", note = "2026-11-18 (owner: too heavy even at 0-1 turn, return to a standard 5 A set-up) -> standard values. Was 40 (impacts too soft); 100 before. 2026-11-18 (owner: much smoother): 100 -> 40 A/s, so the current changes by at most 0.2 A per 5 ms cycle (a 5 A change takes 125 ms): fewer sudden jerks, softer impacts. Before: owner decision 2026-11-17: 50 -> 100 A/s (1.0 A in 10 ms). Before: 5 -> 50 A/s. Bench: at 5 A/s a 12.5 Hz sine of 0.8 A came out as about +-0.1 A (amplitude limit = slew * period / 4) and a 150 ms pulse only ramped up (about 0.18 A per sample), so game effects (gravel, bumps, impacts) were nearly erased. 50 A/s = 0.8 A in about 16 ms. Next step if all is calm: 100 A/s. The emergency stop (torque 0 + IDLE) does not go through this limiter", how_to_measure = "Maximum change of the commanded current per second." }
vel_filter_hz           = { value = 12.0, status = "assumed", note = "2026-11-18 (owner: turning from 0 to 1 turn must be light, less jerking, gravel stronger). Was 15: smoother. 2026-11-18 (owner: the wheel jerks too much, make it MUCH smoother): the speed from the ODrive is quantised and noisy and the damper (1.6 A per turn/s), the friction and the wall damping multiply it, which came out as small jerks. A first-order low-pass at this frequency smooths it (about 4 deg of delay at a 1 Hz motion, so it does not weaken the damping). 0 = off", how_to_measure = "Hz, 0..200. Lower = smoother but the damping reacts later; 10..25 is sensible." }
constant_filter_hz      = { value = 4.0, status = "assumed", note = "2026-11-18 (still jerks, no log): 6 -> 4. Before: 2026-11-18 (owner: driving straight and turning right the wheel is not pushed gently but jerked to the other side): the game changes its constant force (self-aligning, cornering) in steps about 60 times a second and each step was passed to the motor as a jerk. A first-order low-pass on the constant force and ramp ONLY (time constant 27 ms at 6 Hz) turns every step into a short ramp; gravel (periodic) and the conditions are not filtered. 0 = off", how_to_measure = "Hz, 0..200. Lower = smoother but a crash or a bump arrives later (about 3 time constants); 4..10 is sensible." }
constant_max_amps       = { value = 2.0, status = "assumed", note = "2026-11-18 (owner: at a crash the wheel must only jolt a little, but it was thrown almost two turns back and forth; on a curvy road and even on a straight one it jerked too): the strength of an IMPACT. The game's constant force and ramp (crash, skid, self-aligning) alone are limited to this many amps (2 A = 1 Nm); it was the whole max_amps (5 A, 2.5 Nm), and a light rotor without a centring spring (the game plays) is flung by that. Gravel (periodic, periodic_max_amps) and the spring/wall are not limited by it", how_to_measure = "Amps, 0..max_amps. Raise in steps of 0.5 if crashes are too weak, lower if the wheel is still thrown." }
constant_deadband_amps  = { value = 0.4, status = "assumed", note = "2026-11-18 (owner: the wheel still jerks, also on a straight road where it should not; no log available): the game sends small restless corrections of its constant force all the time (road, camber, tyre noise). A force below this many amps is ignored, above it the rest is rescaled so that a full-scale force is still full scale. 0 = off", how_to_measure = "Amps, 0..3. Raise (0.4 -> 0.8 -> 1.2) if the straight road still jerks; lower if the wheel feels dead/numb around the centre." }
host_gain               = { value = 1.0, status = "assumed", note = "2026-11-18 (owner decision): 5.0 -> 1.0 = OFF, the game force is no longer amplified (at 6 A and x5 the game forces of 1-2 A swung the wheel between the end stops, trace 2026-11-18). Before: 2026-11-17: 3.0 felt but weak, now 5.0 (steps 1 -> 3 -> 5; 1.0 = off). Added because: BeamNG at Strength 400-500 was barely perceptible although ff_play effects at 100 percent were clear, so the game's forces are a small fraction of the full scale (they are normalised for a wheel with several Nm). Game force x host_gain, THEN clamped to +-1 x max_amps: the cap does not change, only weak game forces get stronger and strong ones saturate. 1.0 = off (no behaviour change)", how_to_measure = "Dimensionless multiplier of the game (HID PID) force, 0.1..10. Raise in steps (1 -> 2 -> 3 -> 5); too high makes every force saturate at max_amps and the feel flat." }
invert_game_direction   = { value = true, status = "assumed", note = "2026-11-18 (owner report: driving straight on a good road the wheel starts to weave like a wave and it pushes the wrong way and too hard; gravel and viscous effects, which do not depend on a left/right direction, are fine): the direction of the game's constant force (self-aligning, cornering, crashes), ramp and periodic effects is MIRRORED. Open since the start (FFB_INVERT_HOST_FORCE was never checked with a game): if the sign is wrong the self-aligning force pushes the wheel away from the centre (positive feedback). Spring, damper, friction and inertia of the game are NOT mirrored. Check in the game: turn right at speed and let go, the wheel must come back to the centre; if it is pushed further out, set this to false", how_to_measure = "true / false. Test: in the game at speed turn the wheel to one side and release it: it must return towards the centre." }
gain_periodic           = { value = 8.0, status = "assumed", note = "2026-11-18 (owner: turning from 0 to 1 turn must be light, less jerking, gravel stronger). Was 5: gravel stronger. 2026-11-18: back to 5 (a reduction to 2 was a wrong guess: the owner reports that gravel works fine). 2026-11-18 (owner decision): gravel, rumble strips, engine vibration arrive as weak periodic game effects (sine/square/triangle/saw) and were lost at host_gain 1 (their few percent of the scale are below the friction and cogging of the hub motor). Multiplies ONLY this kind of effect, before the effects are summed", how_to_measure = "Dimensionless, 0..10. Raise until the texture is felt (1 -> 3 -> 5); the periodic part is limited by periodic_max_amps." }
gain_constant           = { value = 1.2, status = "assumed", note = "2026-11-18 (jerks when turning): 1.5 -> 1.2. Before: 2026-11-18 (owner: too heavy even at 0-1 turn, return to a standard 5 A set-up) -> standard values. Was 2. 2026-11-18: back to 2. 2026-11-18 (owner decision): constant force and ramp (cornering force, impacts, crashes). Multiplies ONLY this kind of effect", how_to_measure = "Dimensionless, 0..10." }
gain_condition          = { value = 1.0, status = "assumed", note = "2026-11-18: spring, damper, friction, inertia of the GAME depend on the wheel position or speed (a closed loop with the game and with our own spring): kept at 1, higher values made the wheel swing between the end stops on 2026-11-18 (with host_gain 5)", how_to_measure = "Dimensionless, 0..10. Keep low." }
periodic_max_amps       = { value = 2.2, status = "assumed", note = "2026-11-18 (owner: turning from 0 to 1 turn must be light, less jerking, gravel stronger). Was 1.5 A: gravel stronger. 2026-11-18: back to 1.5 A (0.6 was a wrong guess). 2026-11-18: the periodic part (texture) alone is limited to this, so a strong rumble cannot drown the main force; the total is still limited by max_amps", how_to_measure = "Amps, 0..max_amps." }
regen_power_limit_w     = { value = 20.0, status = "assumed", note = "2026-11-18: when the commanded current opposes the wheel's motion (the wall, the spring, the damper while you push) the motor brakes the wheel and the energy goes into the supply, which cannot take it (24 -> 28 V in 0.3 s at 6 A, VBUS_RANGE). The braking power kt * |A| * 2 pi * |turns/s| is limited to this, so the wall stays strong when you hold it or move slowly and softens when you hit it fast. Starting value, not measured: the brake resistor is 50 W (label); 0 = off. Tune with the vbus_derating flag and the vbus summary of tools/hid_status_log.py", how_to_measure = "Watts, 0..200. Lower if vbus_derating shows up in normal driving; higher if the wall is too soft at speed." }
spring_kp_amps_per_turn = { value = 3.0, status = "assumed", note = "2026-11-17 (owner decision): 1.5 -> 3.0 A/turn for more resistance (the cap max_amps is reached at about 0.33 turn). Before, F5 step 2: reaches max_amps 0.5 A at about 0.33 turn (120 deg) so the direction of the pull is unmistakable. Step 1 value was 0.2 A/turn", how_to_measure = "Centring spring, A per wheel turn away from centre. Gentle." }
spring_only_without_host = { value = true, status = "assumed", note = "2026-11-18 (owner: standing still and turning the wheel it must NOT return to the centre, like in a real car; it returns when you give gas or drive): our own centring spring (the curve) works only while the game plays NO effects (the bench); while the game plays, the centring comes from the game's own forces (self-aligning with the speed) and ours is replaced by the soft stop below. Needs the build WITHOUT -DFFB_SPRING_ONLY_WITHOUT_HOST=0 (that define overrides this entry)", how_to_measure = "true / false." }
stop_start_deg          = { value = 360.0, status = "assumed", note = "2026-11-18: while the game plays, nothing pulls the wheel between the centre and here (1 turn), then a soft stop builds up (smoothstep) so the last half turn gets heavier", how_to_measure = "Degrees from the centre, below stop_full_deg." }
stop_full_deg           = { value = 540.0, status = "assumed", how_to_measure = "Degrees from the centre: the soft stop has its full force here (1.5 turns)." }
stop_amps               = { value = 5.0, status = "assumed", how_to_measure = "Amps of the soft stop at stop_full_deg (0..max_amps)." }
spring_amps_90            = { value = 0.6, status = "assumed", note = "2026-11-18 (owner: too heavy even at 0-1 turn, return to a standard 5 A set-up) -> standard values. 2026-11-18 (owner decision): the centring force is a CURVE instead of a straight line, so the wheel is stiff in the middle and keeps getting heavier up to 1.5 turns (540 deg). Before: spring_kp 3.0 A/turn gave 3.0 A at 360, 3.75 A at 450 and the wall hit the cap at once, so beyond 1 turn the force was flat and light. Linear between the points, 0 at the centre, held at the last value beyond 540 deg. All six 0 = the old straight line (spring_kp_amps_per_turn).", how_to_measure = "Amps at 90 deg from the centre (0..max_amps; must not decrease with the angle)." }
spring_amps_180           = { value = 1.2, status = "assumed", how_to_measure = "Amps at 180 deg from the centre (0..max_amps; must not decrease with the angle)." }
