vbus_derate_start_v     = { value = 25.0, status = "assumed", note = "2026-11-18: regeneration guard. Bench 2026-11-18 (drifting, 6 A): the wheel was forced against the 6 A wall and the supply rose 24.1 -> 28.0 V in 0.3 s, VBUS_RANGE faulted and the wheel went limp. Above this voltage the commanded current fades out linearly (1 at start, 0 at vbus_derate_end_v) so the wheel gets lighter instead. 0 = off. The supply rests at 24.1-24.5 V under load", how_to_measure = "Volts. Between vbus_min_v and vbus_derate_end_v." }
