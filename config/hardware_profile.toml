endstop_amps            = { value = 1.0, status = "assumed", note = "2026-11-18: 5.0 -> 1.0: the spring curve already rises to max_amps at 540 deg, so the wall is only an EXTRA beyond the end of the range (it used to hit the cap within 12 deg and make the force flat)", how_to_measure = "Wall force at full width (clamped by max_amps)." }
endstop_damping_amps_per_turn_s = { value = 0.3, status = "assumed", how_to_measure = "Extra damping inside the end-stop zone." }
